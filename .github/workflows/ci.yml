name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_secret
          POSTGRES_DB: erp_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://erp:erp_secret@localhost:5432/erp_db
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 4000
      SEED_DEMO_USERS: '1'
      OUTBOX_WORKER: '0'
      RATE_LIMIT_PER_MIN: '100000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Start API
        run: |
          node src/index.js > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then echo "API up"; break; fi
            sleep 2
          done
          curl -s http://localhost:4000/api/health || (cat api.log && exit 1)

      - name: API smoke tests
        run: npm run test:api

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: api.log
          if-no-files-found: ignore
