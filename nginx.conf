# Upstream backend (dipakai server 443)
upstream erp_backend {
    server backend:4000;
    keepalive 16;
}

# ---------- HTTP (Enforce HTTP-to-HTTPS 301 Redirect) ----------
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

# ---------- HTTPS ----------
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  # HSTS (6 bulan, subdomains)
  add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  location /api/ {
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
  }

  location = /healthz {
    proxy_pass http://erp_backend/api/health;
    access_log off;
  }
}
