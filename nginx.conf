# Upstream backend (dipakai server 80 & 443)
upstream erp_backend {
    server backend:4000;
    keepalive 16;
}

# ---------- HTTP ----------
server {
  listen 80;
  server_name _;

  client_max_body_size 16m;
  client_body_timeout 60s;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker & manifest tidak boleh di-cache lama (update PWA).
  location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  location /api/ {
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
  }

  location = /healthz {
    proxy_pass http://erp_backend/api/health;
    access_log off;
  }
}

# ---------- HTTPS ----------
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 16m;
  client_body_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  root /usr/share/nginx/html;
  index index.html;

  location / { try_files $uri $uri/ /index.html; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  location /api/ {
    proxy_pass http://erp_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_request_buffering off;
  }

  location = /healthz {
    proxy_pass http://erp_backend/api/health;
    access_log off;
  }
}

# Catatan produksi:
# 1. Ganti docker/certs/{fullchain,privkey}.pem dengan sertifikat CA asli
#    (certbot/Let's Encrypt atau origin cert Cloudflare), lalu restart frontend.
# 2. Untuk memaksa HTTPS, ubah server 80 menjadi:
#      location / { return 301 https://$host$request_uri; }
#      location = /healthz { proxy_pass http://erp_backend/api/health; }
# 3. Set ALLOWED_ORIGINS=https://domain-anda.com di .env agar CORS ketat.
