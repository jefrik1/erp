services:
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
    # Port basis data TIDAK diekspos ke host publik demi keamanan enterprise (P1)
    expose:
      - "5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: erp_redis_prod
    restart: always
    # Port Redis TIDAK diekspos ke host publik
    expose:
      - "6379"
    volumes:
      - redisdata_prod:/data
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: erp_backend_prod
    restart: always
    user: "node"
    # Tanpa bind-mount sumber kode (- .:/app dihapus demi integritas container produksi)
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-erp_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      REDIS_URL: redis://redis:6379
      PORT: 4000
      NODE_ENV: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://erp.sumbermaterial.co.id}
      TRUST_PROXY: "1"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      RATE_LIMIT_DISABLED: "0"
      RATE_LIMIT_PER_MIN: "600"
      LOGIN_MAX_FAILS: "5"
      LOGIN_LOCK_MINUTES: "15"
      WA_GATEWAY_URL: ${WA_GATEWAY_URL:-}
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_TOKEN: ${SMTP_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: erp_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    container_name: erp_backup_prod
    restart: always
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh","-c"]
    command: >
      "echo '[backup] worker start';
       while true; do
         ts=$$(date +%Y%m%d-%H%M%S);
         if pg_dump -h postgres -U erp -d erp_db -Fc -f /backups/erp_$$ts.dump; then
           echo \"[backup] $$ts ok\";
         else
           echo \"[backup] $$ts GAGAL\";
         fi;
         find /backups -name 'erp_*.dump' -type f -mtime +14 -delete 2>/dev/null;
         sleep 86400;
       done"

volumes:
  pgdata_prod:
  redisdata_prod:
